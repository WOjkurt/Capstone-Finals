name: sis_college_head_app
description: "DBTC-Cebu SIS College Head Web App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: 3.12.1
  firebase_auth: 5.5.1
  flutter_bloc: ^9.1.1
  get_it: ^8.0.2
  http: ^1.2.0
  intl: ^0.20.2
  pdf: ^3.11.3
  printing: ^5.14.2
  image: ">=4.3.0 <4.6.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
